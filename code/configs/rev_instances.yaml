# Revision R2.2/R1.7: 18 additional networks (6 scenarios x 3 sizes). Scenario factors override network/model.
# S1 resampled base; S2 hospital share 0.5, capacity sd 25, rho 0.4; S3 hospital share 0.15, sd 10, rho 0.1, 5 clusters;
# S4 p 0.1, eps 0.01; S5 eps 0.05 with fewer shards; S6 p 0.15, share 0.5, sd 25, 8 clusters, rho 0.3.
experiment: sharding
out_dir: results/raw/sharding_inst
